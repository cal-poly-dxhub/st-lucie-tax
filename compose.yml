services:
  db:
    image: postgres:16-alpine
    container_name: st-lucie-tax-db-1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stlucie}
      POSTGRES_USER: ${POSTGRES_USER:-stlucie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stlucie"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
